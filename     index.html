<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terre 2026 → 1 000 000</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111c;color:#eef5fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{height:100%;display:flex;flex-direction:column}#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:0;right:0;text-align:center;padding:10px;pointer-events:none}
#year{font-size:30px;font-weight:800;text-shadow:0 2px 10px #000}
#status{font-size:12px;color:#b9cad7}
#launch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #9fd3f1;background:#123b58;color:white;border-radius:18px;padding:18px 28px;font-size:20px;font-weight:800;box-shadow:0 8px 30px #0009;z-index:5;touch-action:manipulation}
#launch:active{transform:translate(-50%,-50%) scale(.97)}
#info{position:absolute;right:10px;top:75px;width:180px;background:#081725e8;border:1px solid #365269;border-radius:12px;padding:9px;font-size:11px}
#controls{background:#0a1724;border-top:1px solid #263d50;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));max-height:39vh;overflow:auto}
.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}button,select{min-height:42px;border-radius:10px;border:1px solid #35546b;background:#12283a;color:#fff;padding:8px 10px;font-size:14px}
button.primary{background:#205173}button:active{filter:brightness(1.3)}input[type=range]{width:100%;accent-color:#8cc9ef}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.card{background:#0e2232;border:1px solid #233d51;border-radius:8px;padding:6px;font-size:10px}.card b{display:block;font-size:13px}
#timeline{margin-top:5px}.small{font-size:10px;color:#aebdca}
@media(min-width:800px){#controls{max-height:250px;padding:12px 20%;}.grid{grid-template-columns:repeat(6,1fr)}}
</style></head>
<body><div id="app"><div id="stage"><canvas id="globe"></canvas>
<div id="top"><div id="year">2026</div><div id="status">Prêt à lancer</div></div>
<button id="launch" type="button">▶ Lancer la simulation</button>
<div id="info">🌍 Fais glisser le globe avec ton doigt.<br>La simulation est une visualisation prospective, pas une prédiction.</div>
</div>
<div id="controls">
<div class="row"><button id="play" class="primary" type="button">▶ Lancer</button><button id="reset" type="button">↺ 2026</button>
<select id="scenario"><option value="green">🌱 Durable</option><option value="mid" selected>⚖️ Intermédiaire</option><option value="hot">🔥 Fort réchauffement</option><option value="extreme">☄️ Extrême</option></select></div>
<input id="timeline" type="range" min="0" max="1000" value="0" step="1" aria-label="Temps">
<div class="small">2026 → 1 000 000 · glisse pour explorer</div>
<div class="grid" id="stats"></div>
</div></div>
<script>
'use strict';
const canvas=document.getElementById('globe'),ctx=canvas.getContext('2d');
let dpr=1,W=0,H=0,angle=0,drag=false,lastX=0,raf=0;
const state={p:0,run:false,scenario:'mid'};
const S={green:{w:1.6,sea:.6,water:.22,poll:.22},mid:{w:3,sea:1.1,water:.5,poll:.5},hot:{w:5.2,sea:2.2,water:.8,poll:.78},extreme:{w:8,sea:3.8,water:.96,poll:.96}};
function year(p){if(p<300)return 2026+(2300-2026)*p/300;if(p<550)return 2300+(10000-2300)*(p-300)/250;if(p<800)return 10000+(100000-10000)*(p-550)/250;return 100000+(1000000-100000)*(p-800)/200}
function metrics(y,s){let f=Math.min(1,Math.log10(Math.max(1,y-2025))/Math.log10(997975));let n=Math.min(1,Math.max(0,(y-2026)/124));let temp=s.w*(.25+.75*f);let sea=s.sea*(.1+.9*n)+(y>2150?s.sea*.8*Math.min(4,(y-2150)/7850):0);let water=100*(1-s.water*(.15+.85*f));let poll=100*s.poll*(.2+.8*f);let veg=100*(1-s.water*.55*f);let hab=Math.max(0,100-18*temp-.55*sea-.22*poll+(veg-50)*.08);return{temp,sea,water,poll,veg,hab}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.max(1,W*dpr);canvas.height=Math.max(1,H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function draw(){ctx.clearRect(0,0,W,H);let R=Math.min(W,H)*.36,cx=W/2,cy=H*.48;ctx.save();ctx.translate(cx,cy);
let g=ctx.createRadialGradient(-R*.3,-R*.3,R*.1,0,0,R);g.addColorStop(0,'#3989b8');g.addColorStop(1,'#082d4a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();
const blobs=[[.10,-.48,.32,.43],[-.45,-.05,.27,.52],[.36,.08,.23,.39],[-.05,.38,.23,.30],[.60,-.27,.17,.30]];
blobs.forEach((b,i)=>{let x=b[0]*R+Math.sin(angle+i)*R*.035,y=b[1]*R;ctx.save();ctx.translate(x,y);ctx.rotate((i-2)*.22);ctx.beginPath();ctx.ellipse(0,0,b[2]*R,b[3]*R,0,0,Math.PI*2);ctx.fillStyle='#4f8056';ctx.fill();ctx.restore()});
let m=metrics(year(state.p),S[state.scenario]);
ctx.globalAlpha=.10+Math.min(.42,m.temp/18);ctx.fillStyle='#e75b3c';ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
ctx.beginPath();ctx.arc(0,0,R*(1+.012*Math.min(10,m.sea)),0,Math.PI*2);ctx.strokeStyle='#b9ecff';ctx.lineWidth=2;ctx.stroke();
ctx.globalAlpha=.15+(100-m.water)/220;ctx.beginPath();ctx.arc(0,0,R*.82,0,Math.PI*2);ctx.strokeStyle='#78d4ff';ctx.lineWidth=8;ctx.stroke();
ctx.globalAlpha=.12+m.poll/500;for(let i=0;i<10;i++){let a=i*.63+angle,x=Math.cos(a)*R*.7,y=Math.sin(a)*R*.45;ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fillStyle='#6d6870';ctx.fill()}ctx.globalAlpha=1;
ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.strokeStyle='#9db9ca';ctx.lineWidth=1;ctx.stroke();ctx.restore();update(m,year(state.p))}
function update(m,y){document.getElementById('year').textContent=Math.round(y).toLocaleString('fr-FR');document.getElementById('status').textContent=state.run?'Simulation en cours…':(y>=1000000?'Simulation terminée':'Prêt à lancer');document.getElementById('stats').innerHTML=`<div class=card>🌡️<b>+${m.temp.toFixed(1)} °C</b>température</div><div class=card>🌊<b>${m.sea.toFixed(1)} m</b>mer (approx.)</div><div class=card>💧<b>${m.water.toFixed(0)}%</b>eau</div><div class=card>🏭<b>${m.poll.toFixed(0)}%</b>pollution</div><div class=card>🌳<b>${m.veg.toFixed(0)}%</b>végétation</div><div class=card>🏙️<b>${m.hab.toFixed(0)}%</b>habitabilité</div>`}
function setRun(v){state.run=v;document.getElementById('play').textContent=v?'⏸ Pause':'▶ Lancer';document.getElementById('launch').style.display=v?'none':'block';if(v)loop()}
function loop(){if(!state.run)return;state.p+=.45;angle+=.003;if(state.p>=1000){state.p=1000;setRun(false)}document.getElementById('timeline').value=state.p;draw();if(state.run)raf=requestAnimationFrame(loop)}
document.getElementById('launch').onclick=()=>setRun(true);document.getElementById('play').onclick=()=>setRun(!state.run);document.getElementById('reset').onclick=()=>{state.p=0;setRun(false);draw()};document.getElementById('scenario').onchange=e=>{state.scenario=e.target.value;draw()};document.getElementById('timeline').oninput=e=>{state.p=+e.target.value;setRun(false);draw()};
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-lastX)/Math.max(1,W)*4;lastX=e.clientX;draw()}});
window.addEventListener('resize',resize);resize();
</script></body></html>
